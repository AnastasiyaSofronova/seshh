<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Василий Юшков</title>
  <meta name="description" content="Фотограф и видеограф. Василий Юшков. Снимаю на Sony ZV-E10 M2">
  <meta name="theme-color" content="#0c0c0c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="nav" id="nav">
    <div class="nav-inner">
      <a href="#hero" class="nav-logo">Василий Юшков</a>
      <div class="nav-links">
        <a href="#gallery" class="nav-link">Галерея</a>
        <a href="#about" class="nav-link">Обо мне</a>
        <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener" class="nav-instagram">@treesysesh</a>
      </div>
      <button class="nav-toggle" id="navToggle" aria-label="Меню">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#gallery" class="mobile-link">Галерея</a>
    <a href="#about" class="mobile-link">Обо мне</a>
    <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener" class="mobile-link">@treesysesh</a>
  </div>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-bg">
      <img src="hero.jpg" alt="" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content">
      <p class="hero-label">Photography</p>
      <h1 class="hero-title">Василий<br>Юшков</h1>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener" class="hero-instagram">@treesysesh</a>
    </div>
    <a href="#gallery" class="scroll-down">
      <span>Смотреть</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </a>
  </section>

  <!-- Horizontal Gallery -->
  <section class="h-gallery" id="gallery">
    <div class="section-header">
      <h2 class="section-title">Галерея</h2>
      <div class="h-gallery-controls">
        <button class="h-btn" id="prevBtn" aria-label="Назад">←</button>
        <button class="h-btn" id="nextBtn" aria-label="Вперёд">→</button>
      </div>
    </div>
    
    <div class="h-track-wrapper">
      <div class="h-track" id="hTrack">
        <div class="h-item"><img src="02.jpg" alt="" loading="lazy"></div>
        <div class="h-item tall"><img src="03.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="01.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="04.jpg" alt="" loading="lazy"></div>
        <div class="h-item tall"><img src="06.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="09.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="07.jpg" alt="" loading="lazy"></div>
        <div class="h-item tall"><img src="05.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="12.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="08.jpg" alt="" loading="lazy"></div>
        <div class="h-item tall"><img src="14.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="11.jpg" alt="" loading="lazy"></div>
        <div class="h-item"><img src="13.jpg" alt="" loading="lazy"></div>
        <div class="h-item tall"><img src="15.jpg" alt="" loading="lazy"></div>
      </div>
    </div>
  </section>

  <!-- Grid Gallery -->
  <section class="grid-gallery">
    <div class="grid">
      <div class="grid-item large"><img src="07.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="04.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="12.jpg" alt="" loading="lazy"></div>
      <div class="grid-item tall"><img src="03.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="09.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="01.jpg" alt="" loading="lazy"></div>
      <div class="grid-item wide"><img src="08.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="13.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="11.jpg" alt="" loading="lazy"></div>
      <div class="grid-item tall"><img src="14.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="05.jpg" alt="" loading="lazy"></div>
      <div class="grid-item"><img src="15.jpg" alt="" loading="lazy"></div>
    </div>
  </section>

  <!-- About -->
  <section class="about" id="about">
    <div class="about-inner">
      <h2 class="about-title">Василий Юшков</h2>
      <p class="about-role">Фотограф / Видеограф</p>
      <p class="about-camera">Снимаю на Sony ZV-E10 M2</p>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener" class="btn-primary">
        Перейти в Instagram
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 17L17 7M17 7H7M17 7V17"/>
        </svg>
      </a>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-name">Василий Юшков</span>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener" class="footer-link">@treesysesh</a>
      <span class="footer-copy">© 2026</span>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lb-close" aria-label="Закрыть">×</button>
    <button class="lb-prev" aria-label="Назад">‹</button>
    <button class="lb-next" aria-label="Вперёд">›</button>
    <img src="" alt="" class="lb-img" id="lbImg">
  </div>

  <script src="main.js"></script>
</body>
</html>
