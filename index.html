<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Василий Юшков</title>
  <meta name="description" content="Фотографии Василия Юшкова">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <a href="#" class="logo">Василий Юшков</a>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener noreferrer" class="instagram">
        @treesysesh
      </a>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-bg">
      <img src="hero.jpg" alt="" class="hero-img">
      <div class="hero-overlay"></div>
    </div>
    <div class="hero-content">
      <h1 class="hero-title">Василий<br>Юшков</h1>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener noreferrer" class="hero-instagram">
        @treesysesh
      </a>
    </div>
    <div class="scroll-indicator">
      <span></span>
    </div>
  </section>

  <!-- Gallery -->
  <section class="gallery" id="gallery">
    <div class="gallery-grid">
      <div class="gallery-item tall">
        <img src="02.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="01.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item tall">
        <img src="03.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="09.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item tall">
        <img src="04.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="12.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item wide">
        <img src="07.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="05.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item tall">
        <img src="06.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="11.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item tall">
        <img src="14.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="13.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item wide">
        <img src="08.jpg" alt="" loading="lazy">
      </div>
      <div class="gallery-item">
        <img src="15.jpg" alt="" loading="lazy">
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p class="footer-name">Василий Юшков</p>
      <a href="https://www.instagram.com/treesysesh/" target="_blank" rel="noopener noreferrer" class="footer-instagram">
        @treesysesh
      </a>
      <p class="footer-copy">© 2026</p>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Закрыть">&times;</button>
    <button class="lightbox-prev" aria-label="Предыдущее">‹</button>
    <button class="lightbox-next" aria-label="Следующее">›</button>
    <div class="lightbox-content">
      <img src="" alt="" class="lightbox-img">
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
